<div class="max-w-md mx-auto space-y-4">
  <div class="card bg-base-100 shadow-md">
    <div class="card-body items-center text-center gap-3">
      <h2 class="text-sm uppercase tracking-widest">Current ticket</h2>

      @if (onBreak()) {
      <p class="text-4xl font-semibold text-error">On break</p>
      <button class="btn btn-error rounded-full w-full mt-2" (click)="endBreak()">End break</button>
      } @else if (ticket(); as t) {
      <p class="text-6xl font-semibold text-primary">{{ t.code }}</p>
      <p>{{ t.serviceName }}</p>
      <div class="badge badge-outline">{{ t.status }}</div>
      <div class="flex gap-2 w-full mt-2">
        <button class="btn btn-primary rounded-full flex-1" (click)="finish()">Finish</button>
        <button class="btn btn-outline btn-error rounded-full flex-1" (click)="noShow()">No-show</button>
      </div>
      } @else {
      <p class="text-sm">No ticket in progress</p>
      <button class="btn btn-primary rounded-full w-full mt-2" (click)="callNext()">Call next</button>
      <button class="btn btn-outline btn-error rounded-full w-full" (click)="startBreak()">Take a break</button>
      }
    </div>
  </div>

  @if (error()) {
  <p class="text-error text-sm text-center">{{ error() }}</p>
  }
</div>
