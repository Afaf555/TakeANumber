<div class="flex flex-col gap-6">
  <app-page-header title="Employees" subtitle="Accounts for counter staff. One counter can have one employee." />

  <app-alert-modal [message]="success()" type="success" (closed)="success.set('')" />
  <app-alert-modal [message]="error()" type="error" (closed)="error.set('')" />

  <div class="grid gap-4 lg:grid-cols-3 items-start">
    <form class="rounded-2xl border border-base-300 bg-base-100 p-5 flex flex-col gap-4" (ngSubmit)="create()">
      <h2 class="font-semibold">New employee</h2>
      <label class="flex flex-col gap-1.5 text-sm font-medium">Username
        <input class="input w-full rounded-full font-normal" name="username" autocomplete="off" [(ngModel)]="username" required />
      </label>
      <label class="flex flex-col gap-1.5 text-sm font-medium">Password
        <input class="input w-full rounded-full font-normal" name="password" type="password" autocomplete="new-password"
          [(ngModel)]="password" required />
        <span class="text-xs font-normal text-base-content/60">At least 8 characters, with a letter and a digit</span>
      </label>
      <label class="flex flex-col gap-1.5 text-sm font-medium">Counter
        <select class="select w-full rounded-full font-normal" name="counterId" [(ngModel)]="counterId">
          <option [ngValue]="null">No counter</option>
          @for (c of counters(); track c.id) {
          <option [ngValue]="c.id">{{ c.name }}{{ leaveHolder(c.id) ? ' (' + leaveHolder(c.id) + ' on leave)' : '' }}</option>
          }
        </select>
      </label>
      <button class="btn btn-primary rounded-full" type="submit">Create employee</button>
    </form>

    <section class="lg:col-span-2 rounded-2xl border border-base-300 bg-base-100 p-5 flex flex-col gap-3">
      <div class="flex items-baseline justify-between">
        <h2 class="font-semibold">All employees</h2>
        <span class="text-sm text-base-content/60">{{ employees().length }}</span>
      </div>
      <ul class="flex flex-col divide-y divide-base-300">
        @for (e of employees(); track e.id) {
        <li class="flex flex-wrap items-center gap-3 py-3">
          <span class="w-10 h-10 rounded-full bg-primary/10 text-primary grid place-items-center font-bold">{{
            e.username.charAt(0).toUpperCase() }}</span>
          <span class="flex flex-col flex-1 min-w-40">
            <span class="font-medium flex items-center gap-2">{{ e.username }}
              @if (e.onLeaveToday) { <span class="badge badge-sm badge-soft badge-warning">On leave</span> }
            </span>
            <span class="text-xs text-base-content/60 truncate">{{ servicesOf(e) || 'No services' }}</span>
          </span>
          <select class="select select-sm rounded-full w-52" [ngModel]="e.counterId" (ngModelChange)="changeCounter(e, $event)"
            [attr.aria-label]="'Counter for ' + e.username">
            <option [ngValue]="null">No counter</option>
            @for (c of counters(); track c.id) {
            <option [ngValue]="c.id">{{ c.name }}{{ leaveHolder(c.id) ? ' (' + leaveHolder(c.id) + ' on leave)' : '' }}</option>
            }
          </select>
          <button class="btn btn-sm btn-ghost rounded-full text-error" [disabled]="e.hasActiveTickets && !e.onLeaveToday"
            [title]="e.hasActiveTickets && !e.onLeaveToday ? 'Counter has active tickets' : ''" (click)="remove(e.id)">Delete</button>
        </li>
        } @empty {
        <li class="rounded-2xl border border-dashed border-base-300 p-8 text-center text-sm text-base-content/60">No employees yet</li>
        }
      </ul>
    </section>
  </div>
</div>
