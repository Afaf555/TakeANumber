<div class="max-w-2xl mx-auto space-y-4">
  <div class="card bg-base-100 shadow-md">
    <form class="card-body gap-3" (ngSubmit)="create()">
      <h2 class="card-title text-sm uppercase tracking-widest">New employee</h2>

      <input class="input w-full rounded-full" name="username" placeholder="Username" [(ngModel)]="username" required />
      <input class="input w-full rounded-full" name="password" type="password"
        placeholder="Password (min 8, letter and digit)" [(ngModel)]="password" required />

      <select class="select w-full rounded-full" name="counterId" [(ngModel)]="counterId">
        <option [ngValue]="null">No counter</option>
        @for (c of counters(); track c.id) {
        <option [ngValue]="c.id">{{ c.name }}{{ leaveHolder(c.id) ? ' (' + leaveHolder(c.id) + ' on leave)' : '' }}
        </option>
        }
      </select>

      <button class="btn btn-primary rounded-full" type="submit">Create</button>
    </form>
  </div>

  <app-alert-modal [message]="success()" type="success" (closed)="success.set('')" />
  <app-alert-modal [message]="error()" type="error" (closed)="error.set('')" />

  <div class="card bg-base-100 shadow-md">
    <div class="card-body gap-3">
      <h2 class="card-title text-sm uppercase tracking-widest">Employees</h2>

      @for (e of employees(); track e.id) {
      <div class="flex items-center justify-between gap-4">
        <div>
          <p class="font-medium">
            {{ e.username }}
            @if (e.onLeaveToday) { <span class="badge badge-warning badge-sm ml-1">On leave</span> }
          </p>
          <p class="text-xs">{{ servicesOf(e) || 'No services' }}</p>
        </div>
        <select class="select select-sm rounded-full w-64" [ngModel]="e.counterId"
          (ngModelChange)="changeCounter(e, $event)">
          <option [ngValue]="null">No counter</option>
          @for (c of counters(); track c.id) {
          <option [ngValue]="c.id">{{ c.name }}{{ leaveHolder(c.id) ? ' (' + leaveHolder(c.id) + ' on leave)' : '' }}
          </option>
          }
        </select>
        <button class="btn btn-xs btn-outline btn-error rounded-full" [disabled]="e.hasActiveTickets && !e.onLeaveToday"
          [title]="e.hasActiveTickets && !e.onLeaveToday ? 'Counter has active tickets' : ''" (click)="remove(e.id)">
          Delete
        </button>
      </div>
      } @empty {
      <p class="text-sm">No employees yet</p>
      }
    </div>
  </div>
</div>
