<div class="flex flex-col gap-6">
  <app-page-header title="Counters" subtitle="Which services each counter serves, and whether it is open" />

  <app-alert-modal [message]="error()" type="error" (closed)="error.set('')" />

  <form class="rounded-2xl border border-base-300 bg-base-100 p-5 flex flex-wrap items-end gap-3" (ngSubmit)="add()">
    <label class="flex flex-col gap-1.5 text-sm font-medium flex-1 min-w-56">New counter
      <input class="input w-full rounded-full font-normal" name="name" placeholder="e.g. Counter 5" [(ngModel)]="newName" required />
    </label>
    <button class="btn btn-primary rounded-full" type="submit">Add counter</button>
  </form>

  <div class="grid gap-4 md:grid-cols-2">
    @for (c of counters(); track c.id) {
    <section class="rounded-2xl border bg-base-100 p-5 flex flex-col gap-4" [class.border-base-300]="c.isActive"
      [class.border-dashed]="!c.isActive" [class.border-base-content/20]="!c.isActive">
      <div class="flex flex-wrap items-center gap-3">
        @if (editingId === c.id) {
        <input class="input input-sm rounded-full flex-1 min-w-32" name="editName" [(ngModel)]="editName"
          (keyup.enter)="saveEdit(c)" />
        <button class="btn btn-xs btn-primary rounded-full" (click)="saveEdit(c)">Save</button>
        <button class="btn btn-xs btn-ghost rounded-full" (click)="cancelEdit()">Cancel</button>
        } @else {
        <h2 class="text-lg font-semibold">{{ c.name }}</h2>
        <button class="btn btn-xs btn-ghost rounded-full" (click)="startEdit(c)">Rename</button>
        }
        <label class="ml-auto flex items-center gap-2 text-sm" [class.text-success]="c.isActive"
          [class.text-base-content/60]="!c.isActive">
          {{ c.isActive ? 'Open' : 'Closed' }}
          <input type="checkbox" class="toggle toggle-success toggle-sm" [checked]="c.isActive" #active
            (change)="toggleActive(c, active.checked)" />
        </label>
      </div>

      <div class="flex flex-col gap-2">
        <span class="text-xs font-semibold uppercase tracking-wide text-base-content/50">Services</span>
        <div class="flex flex-wrap gap-2">
          @for (s of services(); track s.id) {
          <label class="flex items-center gap-2 rounded-full border px-3 py-1.5 text-sm cursor-pointer transition-colors"
            [class.border-primary]="c.serviceIds.includes(s.id)" [class.bg-primary/5]="c.serviceIds.includes(s.id)"
            [class.border-base-300]="!c.serviceIds.includes(s.id)">
            <input type="checkbox" class="checkbox checkbox-primary checkbox-xs" [checked]="c.serviceIds.includes(s.id)"
              #cb (change)="toggleService(c, s.id, cb.checked)" />
            {{ s.name }}
          </label>
          } @empty {
          <p class="text-sm text-base-content/60">Create services first</p>
          }
        </div>
      </div>

      <div class="flex justify-end border-t border-base-300 pt-3">
        <button class="btn btn-sm btn-ghost rounded-full text-error" [disabled]="c.hasActiveTickets"
          [title]="c.hasActiveTickets ? 'Counter has active tickets' : ''" (click)="remove(c.id)">Delete counter</button>
      </div>
    </section>
    } @empty {
    <p class="md:col-span-2 rounded-2xl border border-dashed border-base-300 p-8 text-center text-sm text-base-content/60">No counters yet</p>
    }
  </div>
</div>
