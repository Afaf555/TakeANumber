name: CI

# runs on every push and on every pull request to master
on:
  push:
  pull_request:
    branches: [master]

# a newer push on the same branch cancels the older run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: Build API (.NET)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: API
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

  client:
    name: Build client (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npx ng build --configuration production

  docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [api, client]   # only if both builds passed
    steps:
      - uses: actions/checkout@v5

      - name: Build API image
        run: docker build -t takeanumber-api ./API

      - name: Build client image
        run: docker build -t takeanumber-client ./client